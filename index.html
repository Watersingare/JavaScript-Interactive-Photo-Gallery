<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1: Thư viện ảnh tương tác Cơ bản</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        .gallery-container {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        #image {
            width: 650px;
            height: 380px;
            border: 4px solid #2c3e50;
            border-radius: 8px;
            margin: 0 auto 20px auto;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            line-height: 380px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            background-color: #e0e0e0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .preview {
            width: 110px;
            height: 75px;
            margin: 6px;
            cursor: pointer;
            border: 3px solid #fff;
            border-radius: 6px;
            object-fit: cover;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s, border-color 0.2s;
        }

        .preview:hover {
            border-color: #3498db;
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <!-- Khung hiển thị hình lớn -->
        <div id="image">
            Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.
        </div>

        <!-- 6 ảnh thu nhỏ -->
        <img class="preview" 
             src="https://picsum.photos/id/1003/600/400" 
             alt="Chú hươu ngơ ngác trong rừng" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             src="https://picsum.photos/id/1024/600/400" 
             alt="Chú đại bàng tung cánh" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             src="https://picsum.photos/id/1018/600/400" 
             alt="Dãy núi đá hùng vĩ" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             src="https://picsum.photos/id/1043/600/400" 
             alt="Rừng nguyên sinh xanh mát" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             src="https://picsum.photos/id/1029/600/400" 
             alt="Thành phố rộng lớn" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             src="https://picsum.photos/id/1036/600/400"
             alt="Khung cảnh tuyết phủ trắng xóa" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">
    </div>

    <script src="script.js"></script>
</body>
</html>
